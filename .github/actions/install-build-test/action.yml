name: install-build-test
description: "Install rust, build, and test with nextest for the given target."

inputs:
  target:
    description: Build target.
    required: true

runs:
  using: composite
  steps:
    - name: Install rust
      run: |
        rustup default stable
        rustup component add rustfmt
        rustup target add ${{ inputs.target }}
      shell: bash

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.target }}
        save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Build
      run: cargo build --target ${{ inputs.target }}
      shell: bash

    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-nextest

    - name: Test
      run: cargo nextest run --target ${{ inputs.target }} --no-capture
      shell: bash
